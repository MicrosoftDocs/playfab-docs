name: Merge Main to Live

on:
  schedule:
    # Run at 9:00 AM UTC every Tuesday
    - cron: '0 9 * * 2'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create branch and PR
      pull-requests: write  # Required to create pull request
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Check if it's 2nd or 4th Tuesday
        id: check_date
        run: |
          # Get the current day of the month
          day=$(date +%d)
          # Remove leading zero if present
          day=$((10#$day))
          
          # Calculate which week of the month we're in (1-5)
          week=$(( (day - 1) / 7 + 1 ))
          
          # Get the current day of week (1=Monday, 2=Tuesday, ..., 7=Sunday)
          dow=$(date +%u)
          
          echo "Day of month: $day"
          echo "Week of month: $week"
          echo "Day of week: $dow"
          
          # Check if today is Tuesday (dow=2) and it's the 2nd or 4th week
          if [ "$dow" = "2" ] && ([ "$week" = "2" ] || [ "$week" = "4" ]); then
            echo "should_merge=true" >> $GITHUB_OUTPUT
            echo "This is the 2nd or 4th Tuesday of the month. Proceeding with merge."
          else
            echo "should_merge=false" >> $GITHUB_OUTPUT
            echo "Not the 2nd or 4th Tuesday. Skipping merge."
          fi
      
      - name: Configure Git
        if: steps.check_date.outputs.should_merge == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Create merge branch and PR
        if: steps.check_date.outputs.should_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching branches..."
          git fetch origin Main:Main || git fetch origin main:Main
          git fetch origin Live:Live || git fetch origin live:Live
          
          # Create a unique branch name for this merge
          BRANCH_NAME="merge-main-to-live-$(date +'%Y-%m-%d')-${{ github.run_id }}"
          
          echo "Creating merge branch from Live: $BRANCH_NAME"
          git checkout -b $BRANCH_NAME Live
          
          echo "Merging Main into merge branch..."
          if git merge Main -m "Automated merge: Main into Live ($(date +'%Y-%m-%d'))" --no-edit; then
            echo "Merge successful!"
            
            echo "Pushing merge branch to origin..."
            git push origin $BRANCH_NAME
            
            echo "Creating Pull Request..."
            PR_BODY="This is an automated pull request to merge Main branch into Live branch.

          **Schedule:** This PR is created on the 2nd and 4th Tuesday of each month.
          
          **Instructions:**
          - Review the changes
          - Ensure all checks pass
          - Code owners should approve this PR
          - Merge when ready
          
          If there are conflicts, they will need to be resolved manually."
            
            gh pr create \
              --base Live \
              --head $BRANCH_NAME \
              --title "Automated merge: Main to Live ($(date +'%Y-%m-%d'))" \
              --body "$PR_BODY"
            
            echo "Pull request created successfully!"
          else
            echo "❌ Merge conflict detected!"
            echo "Cannot create PR automatically due to conflicts."
            echo "Please resolve conflicts manually by:"
            echo "1. Creating a branch from Live"
            echo "2. Merging Main into that branch"
            echo "3. Resolving conflicts"
            echo "4. Creating a PR to Live"
            git merge --abort
            exit 1
          fi
      
      - name: Report PR creation status
        if: always() && steps.check_date.outputs.should_merge == 'true'
        run: |
          if [ '${{ job.status }}' = 'success' ]; then
            echo "✅ Successfully created Pull Request from Main to Live branch"
            echo "Code owners can now review and approve the PR"
          else
            echo "❌ Failed to create Pull Request"
            echo "Please check for merge conflicts and create the PR manually"
          fi
